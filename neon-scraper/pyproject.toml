version = "0.1.0"
description = "Local-first passive web and Tor-ready exposure scraper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[project.optional-dependencies]
dns = [
    "dnspython>=2.6.1",
]
tor = [
    "requests[socks]>=2.32.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
neon-scraper = "neon_scraper.cli:main"
